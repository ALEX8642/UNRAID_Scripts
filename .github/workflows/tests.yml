name: tests
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools the shell tests need
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq curl && pip install requests rich
      - name: Unit tests (safe_ops, seed_cleanup, hnr_guard, orphan_scan, dupe_review, cross-disk-dedupe)
        run: python -m unittest discover -s mothership/tests -v
      - name: Shell syntax
        run: for f in mothership/*.sh; do bash -n "$f"; done
